# Manual check of the daily email: builds the latest day's real email and sends it only to the Stocksplain address
# itself (SMTP_USER). Touches no subscriber and no database.
name: Email test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Send the latest daily email to the Stocksplain address
        shell: python
        run: |
          import os, smtplib, ssl, sys
          sys.path.insert(0, os.getcwd())
          from email.message import EmailMessage
          from pathlib import Path
          from digest.email_daily import compose
          user, pw = os.environ["SMTP_USER"].strip(), os.environ["SMTP_PASS"].replace(" ", "").strip()
          assert user and pw, "SMTP_USER / SMTP_PASS secrets are missing"
          day = sorted(p.stem for p in Path("data/briefs").glob("*.json"))[-1]
          msg = compose(day)
          unsub = "https://stocksplain.app/unsubscribe.html"
          m = EmailMessage()
          m["From"], m["To"], m["Subject"] = f"Stocksplain <{user}>", user, "[Test] " + msg["subject"]
          m.set_content(msg["text"].replace("{UNSUB}", unsub))
          m.add_alternative(msg["html"].replace("{UNSUB}", unsub), subtype="html")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context(), timeout=30) as s:
              s.login(user, pw)
              s.send_message(m)
          print(f"Sent the {day} email to the Stocksplain address")
